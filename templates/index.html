<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termux Edge Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        /* Ensure textarea fills available space */
        #editor { min-height: 60vh; }
        @media (max-width: 640px) {
            #editor { min-height: 45vh; }
        }
        /* Smooth archive slide */
        .archive-enter { animation: slideIn 0.2s ease-out; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 px-4 py-3 sticky top-0 z-10">
        <div class="max-w-5xl mx-auto flex items-center justify-between gap-3">
            <h1 class="text-lg font-bold text-white whitespace-nowrap">📦 Edge Vault</h1>
            <div class="flex flex-wrap gap-2 justify-end">
                <button onclick="pullText()" id="btnPull"
                    class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition shadow">
                    ⬇ Pull
                </button>
                <button onclick="pushText()" id="btnPush"
                    class="bg-green-600 hover:bg-green-500 active:bg-green-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition shadow">
                    ⬆ Push
                </button>
                <button onclick="copyText()"
                    class="bg-gray-700 hover:bg-gray-600 active:bg-gray-800 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition border border-gray-600">
                    📋 Copy
                </button>
                <label class="bg-amber-600 hover:bg-amber-500 active:bg-amber-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition shadow cursor-pointer">
                    📁 File
                    <input type="file" accept=".txt,.md,.csv,.json,.xml,.html,.log" class="hidden" onchange="uploadFile(event)">
                </label>
                <button onclick="toggleArchive()"
                    class="bg-purple-600 hover:bg-purple-500 active:bg-purple-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition shadow">
                    📚 Archive
                </button>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="flex-grow flex max-w-5xl w-full mx-auto p-3 gap-3 relative">

        <!-- Editor -->
        <div class="flex-grow flex flex-col w-full">
            <div id="statusAlert" class="hidden mb-2 px-3 py-2 rounded text-sm font-medium text-center"></div>
            <textarea id="editor"
                class="flex-grow w-full bg-gray-800 border border-gray-700 rounded-xl p-4 text-gray-100 font-mono text-sm leading-relaxed focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 resize-none"
                placeholder="Paste or type text here. Push to save, Pull to retrieve last entry. Ctrl+Enter = Push"></textarea>
            <div class="flex justify-between items-center mt-1 px-1 text-xs text-gray-500">
                <span id="charCount">0 chars</span>
                <span id="sizeCount">0 B</span>
            </div>
        </div>

        <!-- Archive Panel -->
        <aside id="archivePanel" class="hidden archive-enter w-80 shrink-0 bg-gray-800 border border-gray-700 rounded-xl flex flex-col shadow-2xl
            fixed right-3 top-16 bottom-3 z-20
            sm:relative sm:right-0 sm:top-0 sm:bottom-0">
            <div class="p-3 border-b border-gray-700 flex justify-between items-center">
                <h2 class="font-bold">Vault Archive</h2>
                <button onclick="toggleArchive()" class="text-gray-400 hover:text-white text-lg leading-none">&times;</button>
            </div>
            <ul id="archiveList" class="overflow-y-auto flex-grow p-2 space-y-2"></ul>
        </aside>
    </main>

    <script>
        const editor = document.getElementById('editor');
        const alertBox = document.getElementById('statusAlert');
        const archivePanel = document.getElementById('archivePanel');
        const charCount = document.getElementById('charCount');
        const sizeCount = document.getElementById('sizeCount');

        // --- Character counter ---
        function updateCounter() {
            const len = editor.value.length;
            charCount.textContent = len.toLocaleString() + ' chars';
            const bytes = new Blob([editor.value]).size;
            if (bytes < 1024) sizeCount.textContent = bytes + ' B';
            else if (bytes < 1048576) sizeCount.textContent = (bytes / 1024).toFixed(1) + ' KB';
            else sizeCount.textContent = (bytes / 1048576).toFixed(2) + ' MB';
        }
        editor.addEventListener('input', updateCounter);

        // --- Ctrl+Enter shortcut ---
        editor.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); pushText(); }
        });

        // --- Alert handler ---
        let alertTimer;
        function showAlert(msg, isError = false) {
            clearTimeout(alertTimer);
            alertBox.textContent = msg;
            alertBox.className = `mb-2 px-3 py-2 rounded text-sm font-medium text-center ${isError ? 'bg-red-900/60 text-red-300' : 'bg-green-900/60 text-green-300'}`;
            alertBox.style.display = 'block';
            alertTimer = setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
        }

        // --- PUSH ---
        async function pushText() {
            const content = editor.value.trim();
            if (!content) return showAlert('Nothing to push — editor is empty.', true);

            const btn = document.getElementById('btnPush');
            btn.disabled = true; btn.textContent = '⏳ Saving...';
            try {
                const res = await fetch('/api/push', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                });
                if (res.ok) {
                    editor.value = '';
                    updateCounter();
                    showAlert('✅ Pushed successfully!');
                    if (!archivePanel.classList.contains('hidden')) loadArchive();
                } else {
                    const err = await res.json().catch(() => null);
                    throw new Error(err?.detail || res.statusText);
                }
            } catch (e) {
                showAlert('❌ Push failed: ' + e.message, true);
            } finally {
                btn.disabled = false; btn.textContent = '⬆ Push';
            }
        }

        // --- PULL ---
        async function pullText() {
            const btn = document.getElementById('btnPull');
            btn.disabled = true; btn.textContent = '⏳ Loading...';
            try {
                const res = await fetch('/api/pull');
                if (res.status === 404) return showAlert('Vault is empty — nothing to pull.', true);
                if (!res.ok) throw new Error(res.statusText);
                const data = await res.json();
                editor.value = data.content;
                updateCounter();
                showAlert('⬇ Latest entry loaded.');
            } catch (e) {
                showAlert('❌ Pull failed: ' + e.message, true);
            } finally {
                btn.disabled = false; btn.textContent = '⬇ Pull';
            }
        }

        // --- COPY ---
        function copyText() {
            if (!editor.value) return showAlert('Nothing to copy.', true);
            navigator.clipboard.writeText(editor.value)
                .then(() => showAlert('📋 Copied to clipboard!'))
                .catch(() => {
                    // Fallback for older browsers / insecure contexts
                    editor.select();
                    document.execCommand('copy');
                    showAlert('📋 Copied (fallback).');
                });
        }

        // --- FILE UPLOAD ---
        function uploadFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                editor.value = e.target.result;
                updateCounter();
                showAlert(`📁 Loaded: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`);
            };
            reader.onerror = () => showAlert('❌ Failed to read file.', true);
            reader.readAsText(file);
            event.target.value = ''; // Reset so same file can be re-selected
        }

        // --- ARCHIVE ---
        function toggleArchive() {
            archivePanel.classList.toggle('hidden');
            if (!archivePanel.classList.contains('hidden')) loadArchive();
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(2) + ' MB';
        }

        async function loadArchive() {
            const list = document.getElementById('archiveList');
            list.innerHTML = '<li class="text-center text-gray-500 text-sm py-4">Loading...</li>';
            try {
                const res = await fetch('/api/archive');
                if (!res.ok) throw new Error();
                const data = await res.json();
                list.innerHTML = '';
                if (data.length === 0) {
                    list.innerHTML = '<li class="text-center text-gray-500 text-sm py-6">Archive is empty.</li>';
                    return;
                }
                data.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'p-3 bg-gray-700 hover:bg-gray-600 rounded-lg cursor-pointer transition border border-transparent hover:border-blue-500 group relative';

                    const dateDiv = document.createElement('div');
                    dateDiv.className = 'text-xs text-blue-400 mb-1 flex justify-between';
                    const dateSpan = document.createElement('span');
                    dateSpan.textContent = new Date(item.created_at).toLocaleString('en-US', {
                        month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit'
                    });
                    const sizeSpan = document.createElement('span');
                    sizeSpan.className = 'text-gray-500';
                    sizeSpan.textContent = formatSize(item.size || 0);
                    dateDiv.appendChild(dateSpan);
                    dateDiv.appendChild(sizeSpan);

                    const previewDiv = document.createElement('div');
                    previewDiv.className = 'text-sm text-gray-200 truncate pr-6';
                    previewDiv.textContent = item.preview; // Safe: textContent, no XSS

                    const delBtn = document.createElement('button');
                    delBtn.className = 'absolute top-2 right-2 text-gray-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition text-xs';
                    delBtn.textContent = '🗑';
                    delBtn.title = 'Delete';
                    delBtn.onclick = (e) => { e.stopPropagation(); deleteEntry(item.id); };

                    li.appendChild(dateDiv);
                    li.appendChild(previewDiv);
                    li.appendChild(delBtn);
                    li.onclick = () => loadFromArchive(item.id);
                    list.appendChild(li);
                });
            } catch (e) {
                list.innerHTML = '<li class="text-red-400 text-sm p-3">Failed to load archive.</li>';
            }
        }

        async function loadFromArchive(id) {
            try {
                const res = await fetch(`/api/archive/${id}`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                editor.value = data.content;
                updateCounter();
                showAlert('📂 Loaded from archive.');
            } catch (e) {
                showAlert('❌ Failed to load entry.', true);
            }
        }

        async function deleteEntry(id) {
            if (!confirm('Delete this entry permanently?')) return;
            try {
                const res = await fetch(`/api/archive/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error();
                showAlert('🗑 Entry deleted.');
                loadArchive();
            } catch (e) {
                showAlert('❌ Delete failed.', true);
            }
        }
    </script>
</body>
</html>
