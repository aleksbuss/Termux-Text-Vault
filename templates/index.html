<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termux Edge Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">
    
    <!-- Navigation & Control Panel -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-10">
        <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <h1 class="text-xl font-bold text-white flex items-center gap-2">
                📦 Edge Vault
            </h1>
            <div class="flex gap-2">
                <button onclick="pullText()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-1 shadow-lg">
                    ⬇️ Pull
                </button>
                <button onclick="pushText()" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-1 shadow-lg">
                    ⬆️ Push
                </button>
                <button onclick="copyText()" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-1 border border-gray-600">
                    📋 Copy
                </button>
                <button onclick="toggleArchive()" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-1 shadow-lg ml-4">
                    📚 Archive
                </button>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-grow flex max-w-5xl w-full mx-auto p-4 gap-4 relative">
        
        <!-- Text Editor Interface -->
        <div class="flex-grow flex flex-col w-full transition-all duration-300">
            <div id="statusAlert" class="hidden mb-2 p-2 rounded text-sm font-medium text-center transition"></div>
            <textarea id="editor" 
                class="flex-grow w-full bg-gray-800 border border-gray-700 rounded-xl p-4 text-gray-100 font-mono text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 resize-none shadow-inner"
                placeholder="Enter your payload here. Click Push to transmit the data to the edge server..."></textarea>
        </div>

        <!-- Archive Sidebar (Hidden by default) -->
        <aside id="archivePanel" class="hidden w-80 bg-gray-800 border border-gray-700 rounded-xl flex flex-col shadow-xl absolute right-4 top-4 bottom-4 z-20 md:relative md:top-0 md:right-0 md:bottom-0">
            <div class="p-4 border-b border-gray-700 flex justify-between items-center">
                <h2 class="font-bold text-lg">Vault Archive</h2>
                <button onclick="toggleArchive()" class="text-gray-400 hover:text-white transition">❌</button>
            </div>
            <ul id="archiveList" class="overflow-y-auto flex-grow p-2 space-y-2">
                <!-- Data populated dynamically via JavaScript -->
            </ul>
        </aside>
    </main>

    <script>
        const editor = document.getElementById('editor');
        const alertBox = document.getElementById('statusAlert');
        const archivePanel = document.getElementById('archivePanel');

        // UI Alert handler
        function showAlert(msg, isError = false) {
            alertBox.textContent = msg;
            alertBox.className = `mb-2 p-2 rounded text-sm font-medium text-center transition ${isError ? 'bg-red-900/50 text-red-400' : 'bg-green-900/50 text-green-400'}`;
            alertBox.style.display = 'block';
            setTimeout(() => alertBox.style.display = 'none', 3000);
        }

        // PUSH: Transmit payload and flush editor
        async function pushText() {
            const content = editor.value.trim();
            if (!content) return showAlert("Payload is empty!", true);

            try {
                const res = await fetch('/api/push', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                });
                if (res.ok) {
                    editor.value = ''; // Flush the editor upon successful transmission
                    showAlert("✅ Payload successfully transmitted to the edge node (Push)!");
                    if (!archivePanel.classList.contains('hidden')) loadArchive();
                } else throw new Error();
            } catch (e) {
                showAlert("❌ Network transmission failed.", true);
            }
        }

        // PULL: Fetch the most recent payload
        async function pullText() {
            try {
                const res = await fetch('/api/pull');
                if (res.status === 404) return showAlert("Server vault is empty.", true);
                const data = await res.json();
                editor.value = data.content;
                showAlert("⬇️ Latest payload retrieved successfully (Pull)");
            } catch (e) {
                showAlert("❌ Connection error established.", true);
            }
        }

        // COPY: Transfer editor content to system clipboard
        function copyText() {
            if (!editor.value) return showAlert("No content available to copy.", true);
            navigator.clipboard.writeText(editor.value).then(() => {
                showAlert("📋 Content copied to system clipboard!");
            }).catch(() => {
                showAlert("❌ Clipboard execution failed.", true);
            });
        }

        // ARCHIVE: Toggle visibility and fetch historical index
        async function toggleArchive() {
            archivePanel.classList.toggle('hidden');
            if (!archivePanel.classList.contains('hidden')) {
                loadArchive();
            }
        }

        async function loadArchive() {
            const list = document.getElementById('archiveList');
            list.innerHTML = '<li class="text-center text-gray-500 text-sm py-4">Loading data...</li>';
            try {
                const res = await fetch('/api/archive');
                const data = await res.json();
                list.innerHTML = '';
                if (data.length === 0) {
                    list.innerHTML = '<li class="text-center text-gray-500 text-sm py-4">Archive is empty.</li>';
                    return;
                }
                data.forEach(item => {
                    // Formatting to standard en-US format
                    const date = new Date(item.created_at).toLocaleString('en-US', {hour: '2-digit', minute:'2-digit', day:'2-digit', month:'short'});
                    list.innerHTML += `
                        <li class="p-3 bg-gray-700 hover:bg-gray-600 rounded-lg cursor-pointer transition border border-transparent hover:border-blue-500"
                            onclick="loadFromArchive(${item.id})">
                            <div class="text-xs text-blue-400 mb-1">${date}</div>
                            <div class="text-sm text-gray-200 truncate">${item.preview}...</div>
                        </li>
                    `;
                });
            } catch (e) {
                list.innerHTML = '<li class="text-red-400 text-sm p-2">Data retrieval error.</li>';
            }
        }

        // Fetch a specific payload from the historical index
        async function loadFromArchive(id) {
            try {
                const res = await fetch(`/api/archive/${id}`);
                const data = await res.json();
                editor.value = data.content;
                showAlert("📂 Payload successfully loaded from archive.");
            } catch (e) {
                showAlert("❌ Failed to retrieve the archived payload.", true);
            }
        }
    </script>
</body>
</html>
